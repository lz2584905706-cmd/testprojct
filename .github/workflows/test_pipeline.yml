name: 接口自动化测试 CI 流水线

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  api-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: "my_user_api"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: 安装测试与开发全量依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: 初始化数据库
        run: |
          mysql -h 127.0.0.1 -u root -p123456 my_user_api < sql/init.sql

      - name: 启动后端服务并进行健康检查
        run: |
          python backend/app.py &
          # 工业级健康检查：轮询接口是否就绪，最多等待 30 秒，彻底避免 sleep 3 网络抖动假死
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://127.0.0.1:5000/api/users || true)
            if [ "$STATUS" -eq 200 ] || [ "$STATUS" -eq 401 ]; then
              echo "后端服务已成功就绪（HTTP $STATUS）！"
              exit 0
            fi
            echo "等待后端服务就绪中... ($i/30)"
            sleep 1
          done
          echo "后端服务启动超时失败！"
          exit 1

      - name: 运行接口测试
        env:
          TEST_ENV: dev
        run: |
          python -m pytest

      - name: 安装 Allure 命令行工具
        if: always()
        run: |
          sudo wget -q https://github.com/allure-framework/allure2/releases/download/2.32.0/allure-2.32.0.tgz
          sudo tar -zxvf allure-2.32.0.tgz -C /opt/
          sudo ln -s /opt/allure-2.32.0/bin/allure /usr/bin/allure
          allure --version

      - name: 编译生成 Allure HTML 可视化报告
        if: always()
        run: |
          allure generate reports/allure -o allure-report --clean --single-file

      - name: 上传 Allure HTML 测试报告产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-html-report-py${{ matrix.python-version }}
          path: allure-report
