name: 接口自动化测试 CI 流水线

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  api-test:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: "123456"
          MYSQL_DATABASE: "my_user_api"
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=3

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安装项目依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 初始化数据库
        run: |
          mysql -h 127.0.0.1 -u root -p123456 my_user_api < sql/init.sql

      - name: 启动后端服务
        run: |
          python backend/app.py &
          sleep 3

      - name: 运行接口测试
        env:
          TEST_ENV: dev
        run: |
          python -m pytest

      - name: 上传测试报告产物
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: reports/allure
