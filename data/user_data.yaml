create_user_data:
  - case_name: "create_user_normal_enabled"
    payload:
      name: "dingyi"
      email: "dingyi@test.com"
      status: 1
    expect_code: 201

  - case_name: "create_user_disabled"
    payload:
      name: "eva"
      email: "eva@test.com"
      status: 0
    expect_code: 201

  - case_name: "create_user_long_name"
    payload:
      name: "test_user_with_a_very_long_name"
      email: "long@test.com"
      status: 1
    expect_code: 201

  - case_name: "create_user_chinese_name"
    payload:
      name: "张三丰"
      email: "zhangsf@test.com"
      status: 1
    expect_code: 201

  - case_name: "create_user_minimal_fields"
    payload:
      name: "min"
      email: "min@test.com"
      status: 1
    expect_code: 201

  - case_name: "create_user_no_status_default"
    payload:
      name: "nostatus"
      email: "nostatus@test.com"
    expect_code: 201

  - case_name: "create_user_email_with_plus"
    payload:
      name: "plususer"
      email: "user+tag@test.com"
      status: 1
    expect_code: 201

  - case_name: "create_user_chinese_name2"
    payload:
      name: "王小明"
      email: "wangxm@test.com"
      status: 1
    expect_code: 201

  - case_name: "create_user_name_with_number"
    payload:
      name: "user123"
      email: "user123@test.com"
      status: 1
    expect_code: 201

  - case_name: "create_user_name_50chars"
    payload:
      name: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
      email: "fifty@test.com"
      status: 1
    expect_code: 201

  - case_name: "create_user_dynamic_faker"
    payload:
      name: "${random_name()}"
      email: "${random_email()}"
      status: 1
    expect_code: 201


update_user_data:
  - case_name: "update_name_only"
    need_setup: true
    payload:
      name: "updated_name"
    expect_code: 200

  - case_name: "update_status_only"
    need_setup: true
    payload:
      status: 0
    expect_code: 200

  - case_name: "update_both_fields"
    need_setup: true
    payload:
      name: "both_updated"
      status: 0
    expect_code: 200

  - case_name: "update_not_found"
    need_setup: false
    user_id: 99999
    payload:
      name: "ghost"
    expect_code: 404

  - case_name: "update_email_only"
    need_setup: true
    payload:
      email: "updated_email@test.com"
    expect_code: 200

  - case_name: "update_all_fields"
    need_setup: true
    payload:
      name: "all_fields"
      email: "all_fields@test.com"
      status: 0
    expect_code: 200

  - case_name: "update_duplicate_email"
    need_setup: true
    payload:
      email: "alice@test.com"
    expect_code: 409

  - case_name: "update_name_empty"
    need_setup: true
    payload:
      name: ""
    expect_code: 400

  - case_name: "update_name_too_long_51"
    need_setup: true
    payload:
      name: "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa"
    expect_code: 400

  - case_name: "update_email_invalid_format"
    need_setup: true
    payload:
      email: "notanemail"
    expect_code: 400

  - case_name: "update_status_invalid"
    need_setup: true
    payload:
      status: 3
    expect_code: 400

delete_user_data:
  - case_name: "delete_normal"
    need_setup: true
    expect_code: 200
  - case_name: "delete_not_found"
    need_setup: false
    user_id: 99999
    expect_code: 404
  - case_name: "delete_user_id_zero"
    need_setup: false
    user_id: 0
    expect_code: 404

get_user_data:
  - case_name: "get_user_by_id_1"
    user_id: 1
    expect_code: 200
    expect_name: "alice"
    expect_email: "alice@test.com"
    expect_status: 1

  - case_name: "get_user_by_id_2"
    user_id: 2
    expect_code: 200
    expect_name: "bob"
    expect_email: "bob@test.com"
    expect_status: 1

  - case_name: "get_user_by_id_3_disabled"
    user_id: 3
    expect_code: 200
    expect_name: "carol"
    expect_email: "carol@test.com"
    expect_status: 0

  - case_name: "get_user_not_found"
    user_id: 99999
    expect_code: 404

  - case_name: "get_user_id_zero"
    user_id: 0
    expect_code: 404

  - case_name: "get_user_id_negative"
    user_id: -1
    expect_code: 404
    # 负数id匹配不上 <int:uid> 路由，由 Flask 直接返回 HTML 404，没有 JSON 响应体
    expect_json: false

  - case_name: "get_user_id_100"
    user_id: 100
    expect_code: 404

  - case_name: "get_user_id_200"
    user_id: 200
    expect_code: 404

create_user_negative_data:
  - case_name: "missing_name"
    payload: {"email": "no_name@test.com"}
    expect_code: 400

  - case_name: "missing_email"
    payload: {"name": "no_email"}
    expect_code: 400

  - case_name: "duplicate_email"
    payload: {"name": "dup", "email": "alice@test.com"}
    expect_code: 409

  - case_name: "empty_name"
    payload: { "name": "", "email": "empty@test.com" }
    expect_code: 400

  - case_name: "empty_email"
    payload: { "name": "empty_email", "email": "" }
    expect_code: 400

  - case_name: "missing_both_fields"
    payload: {}
    expect_code: 400

  - case_name: "name_is_null"
    payload: {"name": null, "email": "null@test.com"}
    expect_code: 400

  - case_name: "email_is_null"
    payload: {"name": "null_email", "email": null}
    expect_code: 400

  - case_name: "name_too_long_51"
    payload: {"name": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa", "email": "n51@test.com"}
    expect_code: 400

  - case_name: "email_too_long_101"
    payload: {"name": "long_email", "email": "aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa@test.com"}
    expect_code: 400

  - case_name: "email_invalid_format"
    payload: {"name": "bad_email", "email": "notanemail"}
    expect_code: 400

  - case_name: "status_invalid_abc"
    payload: {"name": "bad_status", "email": "badstatus@test.com", "status": "abc"}
    expect_code: 400

  - case_name: "status_invalid_3"
    payload: {"name": "bad_status3", "email": "badstatus3@test.com", "status": 3}
    expect_code: 400
