create_user_data:
  - case_name: "create_user_normal_enabled"
    name: "dingyi"
    email: "dingyi@test.com"
    status: 1
    expect_code: 201

  - case_name: "create_user_disabled"
    name: "eva"
    email: "eva@test.com"
    status: 0
    expect_code: 201

  - case_name: "create_user_long_name"
    name: "test_user_with_a_very_long_name"
    email: "long@test.com"
    status: 1
    expect_code: 201

  - case_name: "create_user_chinese_name"
    name: "张三丰"
    email: "zhangsf@test.com"
    status: 1
    expect_code: 201

  - case_name: "create_user_minimal_fields"
    name: "min"
    email: "min@test.com"
    status: 1
    expect_code: 201

  - case_name: "create_user_no_status_default"
    name: "nostatus"
    email: "nostatus@test.com"
    status: null
    expect_code: 201


update_user_data:
  - case_name: "update_name_only"
    need_setup: true
    payload:
      name: "updated_name"
    expect_code: 200

  - case_name: "update_status_only"
    need_setup: true
    payload:
      status: 0
    expect_code: 200

  - case_name: "update_both_fields"
    need_setup: true
    payload:
      name: "both_updated"
      status: 0
    expect_code: 200

  - case_name: "update_not_found"
    need_setup: false
    user_id: 99999
    payload:
      name: "ghost"
    expect_code: 404

delete_user_data:
  - case_name: "delete_normal"
    need_setup: true
    expect_code: 200
  - case_name: "delete_not_found"
    need_setup: false
    user_id: 99999
    expect_code: 404

get_user_data:
  - case_name: "get_user_by_id_1"
    user_id: 1
    expect_code: 200
    expect_name: "alice"
    expect_email: "alice@test.com"
    expect_status: 1

  - case_name: "get_user_by_id_2"
    user_id: 2
    expect_code: 200
    expect_name: "bob"
    expect_email: "bob@test.com"
    expect_status: 1

  - case_name: "get_user_by_id_3_disabled"
    user_id: 3
    expect_code: 200
    expect_name: "carol"
    expect_email: "carol@test.com"
    expect_status: 0

  - case_name: "get_user_not_found"
    user_id: 99999
    expect_code: 404

create_user_negative_data:
  - case_name: "missing_name"
    payload: {"email": "no_name@test.com"}
    expect_code: 400

  - case_name: "missing_email"
    payload: {"name": "no_email"}
    expect_code: 400

  - case_name: "duplicate_email"
    payload: {"name": "dup", "email": "alice@test.com"}
    expect_code: 409

  - case_name: "empty_name"
    payload: { "name": "", "email": "empty@test.com" }
    expect_code: 400

  - case_name: "empty_email"
    payload: { "name": "empty_email", "email": "" }
    expect_code: 400