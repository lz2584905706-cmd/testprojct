# Locust 无头自动化压测配置文件
# 常用一键命令：.\.venv\Scripts\python.exe -m locust --config performance/locust.conf MixedLoadUser

# 指定压测脚本路径
locustfile = performance/locustfile.py

# 开启无头模式（不启动网页大屏，跑完自动退出）
headless = true

# 并发虚拟用户总数 & 每秒爬坡启动人数
users = 30
spawn-rate = 5

# 单轮自动运行时长（支持 s/m/h，到点自动停止并触发 @events.test_stop 数据清理）
run-time = 20s

# 仅在结尾输出一次完整汇总统计表
only-summary = true

# 自动导出单文件 HTML 报告与 CSV 数据表（Locust 会自动创建 reports/locust 目录）
html = reports/locust/report_{u}u_{t}.html
csv = reports/locust/stats
